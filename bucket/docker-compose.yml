version: '3.9'

services:
  minio:
    image: minio/minio:latest
    container_name: tech-select-minio
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9101"
    ports:
      - "9100:9000"
      - "9101:9101"
    volumes:
      - ./data:/data